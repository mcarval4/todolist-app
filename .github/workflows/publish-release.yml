name: Publish SemVer Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure the tag is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: mikefarah/yq@v4.44.3
        id: image
        with:
          cmd: yq -r '.image.repository + "@" + .image.digest' charts/todolist/values-demo.yaml
      - uses: sigstore/cosign-installer@v3
      - name: Verify image signature and SBOM attestation
        env:
          IMAGE: ${{ steps.image.outputs.result }}
        run: |
          test -n "$IMAGE"
          test "$IMAGE" != "ghcr.io/replace-me/todolist-app@sha256:replace-me"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
          cosign verify-attestation \
            --type spdx \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
