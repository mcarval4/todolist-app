name: Verify

on:
  pull_request:
  push:
    branches:
      - feat/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python application
        run: python -m py_compile app.py
      - name: Build application image
        run: docker build --tag todolist:verify .
      - name: Verify PostgreSQL driver in image
        run: >-
          docker run --rm --entrypoint python todolist:verify -c
          'from sqlalchemy import create_engine; assert create_engine("postgresql+psycopg2://user:password@db/todolist").dialect.driver == "psycopg2"'
