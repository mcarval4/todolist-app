name: Build And Propose Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          artifact-name: todolist.spdx.json
          output-file: todolist.spdx.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign image with GitHub OIDC
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          cosign attest --yes --type spdx --predicate todolist.spdx.json ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
      - name: Update proposed GitOps digest
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: >-
            yq -i '.image.repository = "ghcr.io/${{ github.repository }}" |
            .image.digest = "${{ steps.image.outputs.digest }}"' charts/todolist/values-demo.yaml
      - name: Create promotion pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          branch: chore/promote-todolist-image
          commit-message: "chore(release): promote signed todolist image"
          title: "chore(release): promote signed TodoList image"
          body: |
            Promotes a signed immutable image digest.
